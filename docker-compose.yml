services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_platform}
      POSTGRES_USER: ${POSTGRES_USER:-code_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-code_platform}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-code_platform}?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-production}
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  postgres_data:
