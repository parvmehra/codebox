name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@platform/server

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace=@platform/server
      - run: npm run build
      - name: Build application containers
        run: docker compose build api worker frontend

      - name: Start worker integration stack
        run: docker compose up -d postgres rabbitmq api worker prometheus grafana

      - name: Verify the multi-language worker flow
        run: node scripts/worker-e2e.mjs

      - name: Verify metrics scraping and Grafana
        run: node scripts/observability-e2e.mjs

      - name: Show integration service logs after failure
        if: failure()
        run: docker compose logs --no-color api postgres rabbitmq worker prometheus grafana

      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes --remove-orphans
