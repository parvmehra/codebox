name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@platform/server

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace=@platform/server
      - run: npm run build
      - name: Build application containers
        run: docker compose build api worker frontend

      - name: Start worker integration stack
        run: docker compose up -d postgres rabbitmq api worker

      - name: Verify the Java worker flow
        run: node scripts/worker-e2e.mjs

      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes --remove-orphans
